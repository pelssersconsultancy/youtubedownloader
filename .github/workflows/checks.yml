name: Checks

on:
  workflow_call:

jobs:
  backend:
    name: Backend type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: backend

      - name: Build
        run: pnpm run build
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  smoke-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: yt-backend:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: |
          mkdir -p /tmp/yt-data/downloads
          docker run -d --name yt-smoke \
            -p 3001:3000 \
            -e DOWNLOAD_DIR=/tmp/yt-data/downloads \
            -v /tmp/yt-data:/app-data \
            yt-backend:smoke

          echo "Waiting for API to respond..."
          for i in $(seq 1 25); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" != "000" ]; then
              echo "API responded with HTTP $STATUS after $((i * 2))s"
              break
            fi
            sleep 2
          done

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health 2>/dev/null || echo "000")
          if [ "$STATUS" = "000" ]; then
            echo "FAIL: API did not respond within 50s"
            docker logs yt-smoke
            exit 1
          fi
          echo "PASS: API responds (HTTP $STATUS)"

      - name: Container logs on failure
        if: failure()
        run: docker logs yt-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f yt-smoke || true
